<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MATCHMETRICS</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--mg:#A8C686;--sm:#DDE8C5;--sp:#F4A6B8;--sc:#FFE1E8;--bg:#FFF9F0;--dg:#35513C;--br:#8A7567;--card:#fff;--tx:#35513C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d2a21;--card:#27382c;--tx:#f1ecdf;--sm:#34503b;--sc:#4a2f38;--br:#cdb9aa;--dg:#cfe3b4}}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--mg);color:#243a2a;border:0;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px #0002}
.btn.p{background:var(--sp)}.btn.g{background:transparent;border:2px solid var(--mg)}
input,select,textarea{background:var(--card);border:2px solid var(--sm);border-radius:10px;padding:7px 10px;max-width:100%}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px #35513c18;margin-bottom:14px;overflow-x:auto}
#app{display:flex;min-height:100vh}nav{width:210px;background:var(--dg);color:#fff;padding:14px;flex-shrink:0}nav h1{font-size:18px;margin:4px 0 14px}
nav a{display:block;padding:9px 12px;border-radius:12px;color:#e8f0dc;cursor:pointer;margin-bottom:3px;font-weight:700}nav a:hover,nav a.on{background:var(--mg);color:#243a2a}
main{flex:1;padding:16px;min-width:0}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}header h2{margin:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stat{background:var(--card);border-radius:16px;padding:12px;border-left:6px solid var(--sp)}.stat b{font-size:24px;display:block}.stat.m{border-color:var(--mg)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}canvas{max-height:260px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--sm);text-align:left;white-space:nowrap}th{background:var(--sm);position:sticky;top:0}
td input{width:80px}.ok{color:#2d7a3e;font-weight:800}.bad{color:#c2395b;font-weight:800}.mut{color:var(--br)}
.tag{background:var(--sc);border-radius:99px;padding:2px 8px;font-size:12px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--dg);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9}
#auth{max-width:380px;margin:6vh auto;padding:16px}#auth .card{text-align:center}#auth input{width:100%;margin:5px 0}
.demo{background:var(--sc);border-radius:14px;padding:10px;margin:10px 0;font-size:14px}
#burger{display:none}@media(max-width:760px){nav{position:fixed;z-index:5;height:100%;left:-230px;transition:.2s}nav.open{left:0}#burger{display:inline-block}}
@media print{nav,header button,.noprint{display:none!important}}
</style></head><body>
<div id="toast"></div><div id="root"></div>
<script>
const $=s=>document.querySelector(s);let DB={users:{}},me=null,page='dash',sid=null,tid=null,charts=[];
try{DB=JSON.parse(localStorage.getItem('mm_v1'))||DB}catch(e){}
const save=()=>{try{localStorage.setItem('mm_v1',JSON.stringify(DB))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mm|'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)};
function seed(){const nm=['Aisyah','Budi','Citra','Dimas','Eka','Fajar','Gita','Hana','Indra','Joko','Kirana','Lintang','Maya','Naufal','Olivia','Putra','Qori','Rizky','Salsa','Tegar'];
const students=nm.map((n,i)=>({id:'S'+String(i+1).padStart(3,'0'),name:n+' (simulasi)',kelas:'XI AKL 1'}));
const tp=[['Persamaan Akuntansi',70,'Kuis'],['Jurnal Umum',75,'Tes'],['Buku Besar',70,'Tugas'],['Neraca Saldo',75,'Tes'],['Jurnal Penyesuaian',80,'Praktikum']].map((x,i)=>({id:'T'+(i+1),name:x[0],type:x[2],max:100,kkm:x[1],w:[1,2,2,1,3][i],date:'2026-08-'+(10+i*7)}));
let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280,scores={};
tp.forEach((t,k)=>{scores[t.id]={};students.forEach((s,i)=>{if((i*3+k)%13==0)return;const a=Math.round(45+rnd()*55);let rr=null;if(a<t.kkm&&rnd()<.6)rr=t.kkm+Math.round(rnd()*12)-3;scores[t.id][s.id]={a,r:rr}})});
return{students,subjects:[{id:'M1',name:'Praktik Akuntansi Perusahaan Jasa',kelas:'XI AKL 1',periode:'Ganjil 2026/2027',topics:tp}],scores,set:{policy:'max',agg:75,enr:90,dec:1,mode:'simple'},log:[]}}
const D=()=>DB.users[me].d,SB=()=>D().subjects.find(x=>x.id==sid)||D().subjects[0];
function log(m){D().log.unshift(new Date().toISOString().slice(0,16)+' '+m);D().log=D().log.slice(0,200)}
// ---- perhitungan
const fin=(t,s)=>{const x=D().scores[t.id]?.[s.id];if(!x||x.a==null)return null;if(x.r==null)return x.a;return D().set.policy=='replace'?x.r:Math.max(x.a,x.r)};
const awal=(t,s)=>D().scores[t.id]?.[s.id]?.a??null;
const stt=(v,t)=>v==null?'Belum dinilai':v>=t.kkm?'Tuntas':'Belum tuntas';
const rd=v=>v==null?'–':(+v).toFixed(D().set.dec);
function st(a){a=a.filter(v=>v!=null);const n=a.length;if(!n)return{n:0};const s=[...a].sort((x,y)=>x-y),m=a.reduce((x,y)=>x+y,0)/n;const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));
return{n,min:s[0],max:s[n-1],mean:m,med:n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,mod:mx>1?Object.keys(c).filter(k=>c[k]==mx).join(', '):'–',sd:Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n),range:s[n-1]-s[0]}}
function agg(s,ts){const p=ts.map(t=>[fin(t,s),t.w||1]).filter(x=>x[0]!=null);if(!p.length)return null;
if(D().set.mode=='weighted'){const w=p.reduce((a,b)=>a+b[1],0);return p.reduce((a,b)=>a+b[0]*b[1],0)/w}return p.reduce((a,b)=>a+b[0],0)/p.length}
function tstat(t){const S=D().students.filter(s=>s.kelas==SB().kelas),v=S.map(s=>fin(t,s)),n=v.filter(x=>x!=null).length,tu=v.filter(x=>x!=null&&x>=t.kkm).length;return{S,v,n,tu,bt:n-tu,pct:n?tu/n*100:0,...st(v)}}
// ---- chart
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;cfg.options={responsive:true,maintainAspectRatio:true,...cfg.options};charts.push(new Chart(el,cfg))}
const PAL=['#A8C686','#F4A6B8','#8A7567','#35513C'];
// ---- auth
function authView(reg){$('#root').innerHTML=`<div id="auth"><div class="card"><div style="font-size:42px">🍓🍵</div><h1 style="margin:0">MATCHMETRICS</h1><p class="mut">Measure. Visualize. Make It Matter.</p>
<input id="u" placeholder="Username" autocomplete="username"><div style="position:relative"><input id="p" type="password" placeholder="Password" autocomplete="current-password"></div>
${reg?'<input id="p2" type="password" placeholder="Konfirmasi password">':''}
<label class="mut" style="font-size:13px"><input type="checkbox" style="width:auto" onchange="p.type=p2&&(p2.type=this.checked?'text':'password'),this.checked?p.type='text':p.type='password'"> Tampilkan password</label>
<div id="err" class="bad" style="min-height:22px"></div><button class="btn" style="width:100%" id="go" onclick="${reg?'doReg()':'doLogin()'}">${reg?'Daftar':'Login'}</button>
<p><a href="#" onclick="authView(${!reg});return false">${reg?'Sudah punya akun? Login':'Belum punya akun? Daftar'}</a></p>
${reg?'':'<div class="demo"><b>Try Demo Account</b><br>Username: Guru1 · Password: Guru123<br><button class="btn p" style="margin-top:6px" onclick="u.value=\'Guru1\';p.value=\'Guru123\'">Isi otomatis</button></div>'}
<p class="mut" style="font-size:12px">Mode demo: data & akun hanya tersimpan di browser ini (password di-hash SHA-256 lokal), belum setara keamanan produksi.</p></div></div>`}
async function doLogin(){const u=$('#u').value.trim(),p=$('#p').value;if(!u||!p)return $('#err').textContent='Username dan password wajib diisi.';
$('#go').textContent='Memproses…';await new Promise(r=>setTimeout(r,500));
if(u=='Guru1'&&!DB.users.Guru1){DB.users.Guru1={h:await H('Guru123'),d:seed()};save()}
const x=DB.users[u];if(!x||x.h!=await H(p)){$('#go').textContent='Login';return $('#err').textContent='Username atau password salah.'}
me=u;try{sessionStorage.setItem('mm_me',u)}catch(e){}shell()}
async function doReg(){const u=$('#u').value.trim(),p=$('#p').value;if(u.length<3)return $('#err').textContent='Username minimal 3 karakter.';if(DB.users[u]||u.toLowerCase()=='guru1'&&DB.users.Guru1)return $('#err').textContent='Username sudah dipakai.';
if(p.length<6)return $('#err').textContent='Password minimal 6 karakter.';if(p!=$('#p2').value)return $('#err').textContent='Konfirmasi password tidak cocok.';
DB.users[u]={h:await H(p),d:{students:[],subjects:[],scores:{},set:{policy:'max',agg:75,enr:90,dec:1,mode:'simple'},log:[]}};save();toast('Akun dibuat, silakan login.');authView(false)}
function logout(){try{sessionStorage.removeItem('mm_me')}catch(e){}me=null;authView(false)}
// ---- shell
const NAV=[['dash','🏠 Dashboard'],['siswa','🎓 Data Siswa'],['topik','📚 Mapel & Topik'],['nilai','✏️ Input & Impor Nilai'],['analisis','📊 Analisis Per Topik'],['rekap','🗂️ Rekapitulasi'],['rem','🌱 Remedial & Pengayaan'],['lap','📄 Laporan'],['set','⚙️ Pengaturan']];
function shell(){if(!D().subjects.length&&!D().students.length&&me!='Guru1'){}$('#root').innerHTML=`<div id="app"><nav id="nav"><h1>🍓 MATCHMETRICS</h1>${NAV.map(n=>`<a data-p="${n[0]}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}<a onclick="logout()">🚪 Keluar (${esc(me)})</a></nav><main><header><button class="btn g" id="burger" onclick="nav.classList.toggle('open')">☰</button><h2 id="ttl"></h2><select id="sbsel" onchange="sid=this.value;go(page)"></select></header><div id="main"></div></main></div>`;go('dash')}
function go(p){page=p;nav.classList.remove('open');document.querySelectorAll('nav a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p==p));$('#ttl').textContent=NAV.find(n=>n[0]==p)[1];
const ss=D().subjects;if(!sid||!ss.find(x=>x.id==sid))sid=ss[0]?.id;$('#sbsel').innerHTML=ss.map(x=>`<option value="${x.id}" ${x.id==sid?'selected':''}>${esc(x.name)} · ${esc(x.kelas)}</option>`).join('');
charts.forEach(c=>c.destroy());charts=[];$('#main').innerHTML='<div class="card mut">Memuat…</div>';
setTimeout(()=>{try{if(!ss.length&&!['topik','siswa','set'].includes(p))$('#main').innerHTML=empty();else V[p]()}catch(e){$('#main').innerHTML='<div class="card bad">Terjadi kesalahan: '+esc(e.message)+'</div>'}},0)}
const empty=()=>`<div class="card" style="text-align:center"><div style="font-size:48px">🍓</div><p>Belum ada data asesmen. Yuk, tambahkan topik pertamamu!</p><button class="btn" onclick="go('topik')">Tambah Mapel & Topik</button> <button class="btn p" onclick="go('nilai')">Input Nilai</button> <button class="btn g" onclick="go('nilai')">Unggah Excel</button></div>`;
const tbl=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const badge=(s)=>`<span class="${s=='Tuntas'?'ok':s=='Belum tuntas'?'bad':'mut'}">${s}</span>`;
function xl(name,aoa){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Data');XLSX.writeFile(wb,name+'.xlsx')}
const V={};
// ---- dashboard
function dashData(){const b=SB(),S=D().students.filter(s=>s.kelas==b.kelas),T=b.topics;const av=S.map(s=>agg(s,T));
const rem=S.filter(s=>T.some(t=>{const v=fin(t,s);return v!=null&&v<t.kkm})),enr=S.filter(s=>{const a=agg(s,T);return a!=null&&a>=D().set.enr});
const ag=av.filter(x=>x!=null),tu=S.filter(s=>{const a=agg(s,T);return a!=null&&a>=D().set.agg}).length;return{b,S,T,av,rem,enr,ag,tu}}
V.dash=()=>{const{b,S,T,av,rem,enr,ag,tu}=dashData();const m=ag.length?ag.reduce((a,c)=>a+c,0)/ag.length:null;
const ts=T.map(t=>({t,...tstat(t)})).filter(x=>x.n);let ins='';
if(ts.length){const lo=[...ts].sort((a,b)=>a.pct-b.pct)[0],hi=[...ts].sort((a,b)=>b.mean-a.mean)[0],bt=[...ts].sort((a,b)=>b.bt-a.bt)[0];
ins=`<li>Ketuntasan terendah: <b>${esc(lo.t.name)}</b> (${lo.pct.toFixed(0)}%, ${lo.bt} siswa belum tuntas).</li><li>Rata-rata tertinggi: <b>${esc(hi.t.name)}</b> (${rd(hi.mean)}).</li><li>Siswa belum tuntas terbanyak: <b>${esc(bt.t.name)}</b> (${bt.bt} siswa).</li>`;
const gain=S.filter(s=>T.some(t=>{const x=D().scores[t.id]?.[s.id];return x&&x.r!=null&&x.r>x.a}));if(gain.length)ins+=`<li>${gain.length} siswa meningkat setelah remedial.</li>`;
const sdv=[...ts].sort((a,b)=>b.sd-a.sd)[0];ins+=`<li>Sebaran nilai paling lebar: <b>${esc(sdv.t.name)}</b> (simpangan baku ${rd(sdv.sd)}).</li>`}
const miss=T.reduce((a,t)=>a+S.filter(s=>awal(t,s)==null).length,0);
$('#main').innerHTML=`<div class="grid">${[['Total siswa',S.length],['Mata pelajaran',D().subjects.length],['Topik asesmen',T.length],['Rata-rata kelas',rd(m)],['Tuntas (agregat ≥'+D().set.agg+')',tu],['Belum tuntas',ag.length-tu],['% ketuntasan',ag.length?(tu/ag.length*100).toFixed(0)+'%':'–'],['Perlu remedial',rem.length],['Layak pengayaan',enr.length]].map((x,i)=>`<div class="stat ${i%2?'':'m'}">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>
${miss?`<div class="card">⚠️ ${miss} nilai belum diinput. Statistik hanya memakai nilai yang tersedia (nilai kosong ≠ 0).</div>`:''}
<div class="card"><b>💡 Insight otomatis</b><ul>${ins||'<li>Belum ada nilai.</li>'}</ul></div>
<div class="two"><div class="card"><b>Distribusi nilai keseluruhan</b><canvas id="c1"></canvas></div><div class="card"><b>Rata-rata per topik</b><canvas id="c2"></canvas></div><div class="card"><b>% ketuntasan per topik</b><canvas id="c3"></canvas></div><div class="card"><b>Sebelum vs sesudah remedial</b><canvas id="c4"></canvas></div><div class="card"><b>Perkembangan rata-rata (tanggal asesmen)</b><canvas id="c5"></canvas></div></div>`;
const bins=['<60','60-69','70-79','80-89','90-100'],cnt=[0,0,0,0,0];ag.forEach(v=>cnt[v<60?0:v<70?1:v<80?2:v<90?3:4]++);
mk('c1',{type:'bar',data:{labels:bins,datasets:[{label:'Jumlah siswa',data:cnt,backgroundColor:PAL[0]}]}});
const L=T.map(t=>t.name);mk('c2',{type:'bar',data:{labels:L,datasets:[{label:'Rata-rata',data:T.map(t=>tstat(t).mean??null),backgroundColor:PAL[1]}]},options:{scales:{y:{min:0,max:100}}}});
mk('c3',{type:'bar',data:{labels:L,datasets:[{label:'% tuntas',data:T.map(t=>tstat(t).pct),backgroundColor:PAL[0]}]},options:{scales:{y:{min:0,max:100}}}});
const ra=t=>{const a=st(S.filter(s=>D().scores[t.id]?.[s.id]?.r!=null).map(s=>awal(t,s))).mean,f=st(S.filter(s=>D().scores[t.id]?.[s.id]?.r!=null).map(s=>fin(t,s))).mean;return[a??null,f??null]};
mk('c4',{type:'bar',data:{labels:L,datasets:[{label:'Nilai awal (peserta remedial)',data:T.map(t=>ra(t)[0]),backgroundColor:PAL[2]},{label:'Nilai akhir',data:T.map(t=>ra(t)[1]),backgroundColor:PAL[0]}]}});
const tt=[...T].filter(t=>t.date).sort((a,b)=>a.date.localeCompare(b.date));mk('c5',{type:'line',data:{labels:tt.map(t=>t.date),datasets:[{label:'Rata-rata kelas',data:tt.map(t=>tstat(t).mean??null),borderColor:PAL[3],backgroundColor:PAL[1],tension:.3}]}})}
// ---- siswa
V.siswa=()=>{const q=(window.qs||'').toLowerCase();const S=D().students.filter(s=>(s.id+s.name).toLowerCase().includes(q));
$('#main').innerHTML=`<div class="card"><input placeholder="Cari nama / ID…" value="${esc(window.qs||'')}" oninput="qs=this.value;V.siswa();document.querySelector('#main input').focus()"> <button class="btn" onclick="addS()">+ Tambah siswa</button> <button class="btn g" onclick="document.getElementById('fs').click()">⬆ Impor Excel/CSV</button><input id="fs" type="file" accept=".xlsx,.xls,.csv" hidden onchange="impS(this.files[0])"> <button class="btn g" onclick="xl('data-siswa',[['ID Siswa','Nama Siswa','Kelas'],...D().students.map(s=>[s.id,s.name,s.kelas])])">⬇ Ekspor</button> <button class="btn g" onclick="xl('template-siswa',[['ID Siswa','Nama Siswa','Kelas'],['S001','Contoh Nama','XI AKL 1']])">Template</button></div>
<div class="card">${S.length?tbl(['ID','Nama','Kelas','Aksi'],S.map(s=>[esc(s.id),esc(s.name),esc(s.kelas),`<button class="btn g" onclick="perf('${esc(s.id)}')">Profil</button> <button class="btn g" onclick="editS('${esc(s.id)}')">Edit</button> <button class="btn p" onclick="delS('${esc(s.id)}')">Hapus</button>`])):'<p class="mut">Belum ada siswa.</p>'}</div><div id="pf"></div>`}
function addS(){const id=(prompt('ID/NIS siswa:')||'').trim();if(!id)return;if(D().students.some(s=>s.id==id))return toast('ID sudah ada (duplikat).');const n=(prompt('Nama siswa:')||'').trim(),k=(prompt('Kelas:',SB()?.kelas||'')||'').trim();if(!n||!k)return toast('Nama dan kelas wajib diisi.');D().students.push({id,name:n,kelas:k});log('tambah siswa '+id);save();V.siswa();toast('Siswa ditambahkan.')}
function editS(id){const s=D().students.find(x=>x.id==id),n=prompt('Nama:',s.name),k=prompt('Kelas:',s.kelas);if(n&&k){s.name=n.trim();s.kelas=k.trim();log('edit siswa '+id);save();V.siswa()}}
function delS(id){if(!confirm('Hapus siswa '+id+' beserta seluruh nilainya?'))return;D().students=D().students.filter(s=>s.id!=id);Object.values(D().scores).forEach(o=>delete o[id]);D().enrRec=ER().filter(r=>r.sid!=id);log('hapus siswa '+id);save();V.siswa()}
async function rows(f){const wb=XLSX.read(await f.arrayBuffer());return wb}
async function impS(f){if(!f)return;const wb=await rows(f);let sh=wb.SheetNames[0];if(wb.SheetNames.length>1)sh=wb.SheetNames[+prompt('Pilih nomor sheet:\n'+wb.SheetNames.map((n,i)=>(i+1)+'. '+n).join('\n'),1)-1]||sh;
const r=XLSX.utils.sheet_to_json(wb.Sheets[sh],{defval:''});let ok=0,upd=0,skip=0,err=[];const seen=new Set();
r.forEach((x,i)=>{const id=String(x['ID Siswa']||x['ID']||x['NIS']||'').trim(),n=String(x['Nama Siswa']||x['Nama']||'').trim(),k=String(x['Kelas']||'').trim();if(!id||!n||!k)return err.push('Baris '+(i+2)+': kolom wajib kosong');if(seen.has(id))return err.push('Baris '+(i+2)+': ID duplikat di file ('+id+')');seen.add(id);const e=D().students.find(s=>s.id==id);e?(upd++):ok++;x._ok=[id,n,k]});
const valid=r.filter(x=>x._ok);if(!confirm(`Pratinjau impor:\n${ok} baru, ${upd} akan diperbarui, ${err.length} gagal.\n${err.slice(0,8).join('\n')}\n\nLanjutkan simpan data valid?`))return;
valid.forEach(x=>{const[id,n,k]=x._ok,e=D().students.find(s=>s.id==id);e?(e.name=n,e.kelas=k):D().students.push({id,name:n,kelas:k})});log('impor siswa '+valid.length);save();V.siswa();toast(`Impor selesai: ${ok} baru, ${upd} diperbarui, ${err.length} gagal.`)}
// ---- mapel & topik

${tbl(['ID','Nama','Rata-rata','Topik ≥ ambang','Aktivitas (bisa diedit)'],enrL().map(e=>[esc(e.s.id),esc(e.s.name),rd(e.ag),e.ok.map(t=>esc(t.name)).join(', ')||'–',`<input style="width:230px" value="${esc((D().enr||{})[e.s.id]||'Soal tantangan / studi kasus lanjutan')}" onchange="(D().enr=D().enr||{})['${e.s.id}']=this.value;save()">`]))||''}<p class="mut">Nilai pengayaan tidak dicampur ke nilai asesmen utama.</p></div>${enrRecCard()}`}
function enrL(){const b=SB(),set=D().set;return D().students.filter(s=>s.kelas==b.kelas).map(s=>({s,ag:agg(s,b.topics),ok:b.topics.filter(t=>{const v=fin(t,s);return v!=null&&v>=set.enr})})).filter(e=>e.ag!=null&&e.ag>=set.enr)}
function remSet(t,s,v){const T=SB().topics.find(x=>x.id==t),o=D().scores[t][s];if(v==='')o.r=null;else{v=+v;if(isNaN(v)||v<0||v>T.max)return toast(`Nilai harus 0–${T.max}.`);o.r=v}log(`remedial ${s} ${T.name}=${o.r} (awal ${o.a})`);save();V.rem()}
const ER=()=>D().enrRec=D().enrRec||[];
function enrRecCard(){const b=SB(),ids=b.topics.map(t=>t.id),L=ER().filter(r=>ids.includes(r.tid)),nm=i=>(D().students.find(s=>s.id==i)||{}).name||i,tn=i=>(b.topics.find(t=>t.id==i)||{}).name||'?';
return`<div class="card"><b>Catatan Pelaksanaan Pengayaan</b> <span class="mut">(skor di sini terpisah dari nilai asesmen utama dan tidak memengaruhi ketuntasan)</span><br><button class="btn" onclick="addER()">+ Catat pengayaan</button> <button class="btn g" onclick="expER()">⬇ Excel</button>${L.length?tbl(['Siswa','Topik','Aktivitas','Tanggal','Skor pengayaan','Status','Catatan',''],L.map(r=>[esc(nm(r.sid)),esc(tn(r.tid)),`<input style="width:180px" value="${esc(r.act)}" onchange="eER('${r.id}','act',this.value)">`,`<input type="date" value="${r.date||''}" onchange="eER('${r.id}','date',this.value)">`,`<input type="number" step="any" value="${r.score??''}" onchange="eER('${r.id}','score',this.value)">`,`<select onchange="eER('${r.id}','status',this.value)">${['Direncanakan','Berlangsung','Selesai'].map(x=>`<option ${x==r.status?'selected':''}>${x}</option>`).join('')}</select>`,`<input value="${esc(r.note||'')}" onchange="eER('${r.id}','note',this.value)">`,`<button class="btn p" onclick="dER('${r.id}')">✕</button>`])):'<p class="mut">Belum ada catatan pengayaan.</p>'}</div>`}
function addER(){const b=SB(),sId=(prompt('ID siswa:')||'').trim();if(!D().students.some(s=>s.id==sId))return toast('ID siswa tidak ditemukan.');const n=+prompt('Pilih nomor topik:\n'+b.topics.map((t,i)=>(i+1)+'. '+t.name).join('\n'),1),t=b.topics[n-1];if(!t)return toast('Topik tidak valid.');const act=(prompt('Aktivitas pengayaan:','Soal tantangan')||'').trim();if(!act)return;const sc=prompt('Skor pengayaan (kosongkan jika belum ada):','');if(sc===null)return;let score=null;if(sc!==''){score=+sc;if(isNaN(score)||score<0||score>t.max)return toast(`Skor harus 0–${t.max}.`)}ER().push({id:'E'+Date.now(),sid:sId,tid:t.id,act,date:new Date().toISOString().slice(0,10),score,note:prompt('Catatan guru (opsional):','')||'',status:score!=null?'Selesai':'Direncanakan'});log(`catat pengayaan ${sId} ${t.name}`);save();V.rem()}
function eER(id,f,v){const r=ER().find(x=>x.id==id);if(f=='score'){if(v==='')v=null;else{v=+v;const t=SB().topics.find(x=>x.id==r.tid);if(isNaN(v)||v<0||(t&&v>t.max)){toast('Skor tidak valid.');return V.rem()}}}r[f]=v;log(`ubah ${f} pengayaan ${r.sid}`);save();toast('Tersimpan.')}
function dER(id){if(!confirm('Hapus catatan pengayaan ini?'))return;D().enrRec=ER().filter(x=>x.id!=id);save();V.rem()}
function expER(){const b=SB(),ids=b.topics.map(t=>t.id);xl('catatan-pengayaan',[['ID','Nama','Topik','Aktivitas','Tanggal','Skor pengayaan','Status','Catatan'],...ER().filter(r=>ids.includes(r.tid)).map(r=>[r.sid,(D().students.find(s=>s.id==r.sid)||{}).name,(b.topics.find(t=>t.id==r.tid)||{}).name,r.act,r.date,r.score,r.status,r.note])])}
const enrHist=id=>{const L=ER().filter(r=>r.sid==id);return`<p><b>Riwayat pengayaan:</b> ${L.length?L.map(r=>esc(r.act)+' ('+r.status+(r.score!=null?', skor '+r.score:'')+')').join('; '):'belum ada'}</p>`};
function perf(id){const s=D().students.find(x=>x.id==id),T=SB().topics;pf.innerHTML=`<div class="card"><b>🍓 Performance Card — ${esc(s.name)}</b> (rata-rata ${rd(agg(s,T))})${tbl(['Topik','Awal','Remedial','Akhir','Status'],T.map(t=>{const x=D().scores[t.id]?.[s.id]||{};return[esc(t.name),rd(x.a),rd(x.r),rd(fin(t,s)),badge(stt(fin(t,s),t))]}))}${enrHist(id)}<canvas id="pc"></canvas><textarea placeholder="Catatan guru…" style="width:100%" onchange="(D().notes=D().notes||{})['${id}']=this.value;save()">${esc((D().notes||{})[id]||'')}</textarea></div>`;
mk('pc',{type:'line',data:{labels:T.map(t=>t.name),datasets:[{label:'Nilai akhir',data:T.map(t=>fin(t,s)),borderColor:PAL[3]},{label:'KKM',data:T.map(t=>t.kkm),borderColor:PAL[1],borderDash:[5,5]}]}});pf.scrollIntoView({behavior:'smooth'})}
// ---- laporan
V.lap=()=>{const b=SB(),T=b.topics,S=D().students.filter(s=>s.kelas==b.kelas),set=D().set;
const dq=[];T.forEach(t=>{const m=S.filter(s=>awal(t,s)==null).length;if(m)dq.push(`${m} siswa belum bernilai pada "${t.name}"`);if(!t.kkm)dq.push(`Topik "${t.name}" tanpa KKM`)});
$('#main').innerHTML=`<div class="card noprint"><button class="btn" onclick="print()">🖨️ Cetak / Simpan PDF</button> <button class="btn g" onclick="expRekap()">⬇ Rekap Excel</button> <button class="btn g" onclick="xl('laporan-ketuntasan',[['Topik','KKM','Dinilai','Tuntas','Belum tuntas','% tuntas','Rata-rata'],...T.map(t=>{const a=tstat(t);return[t.name,t.kkm,a.n,a.tu,a.bt,a.pct,a.mean]})])">⬇ Ketuntasan Excel</button></div>
<div class="card"><h3 style="margin-top:0">Laporan Hasil Asesmen — ${esc(b.name)}</h3><p>Kelas ${esc(b.kelas)} · ${esc(b.periode)} · ${S.length} siswa · Dibuat ${new Date().toLocaleDateString('id-ID',{dateStyle:'long'})}<br>Kriteria: nilai akhir ${set.policy=='max'?'= tertinggi(awal, remedial)':'= nilai remedial bila ada'}; nilai keseluruhan ${set.mode=='weighted'?'rata-rata berbobot':'rata-rata sederhana'}; ambang agregat ${set.agg}; pembulatan ${set.dec} desimal.</p>
${tbl(['Topik','Jenis','KKM','Dinilai','Tuntas','Belum','% tuntas','Rata-rata','Min','Maks'],T.map(t=>{const a=tstat(t);return[esc(t.name),t.type,t.kkm,a.n+'/'+S.length,a.tu,a.bt,a.n?a.pct.toFixed(1)+'%':'–',rd(a.mean),rd(a.min),rd(a.max)]}))}
<h4>Kualitas data</h4><ul>${dq.map(x=>`<li>⚠️ ${esc(x)}</li>`).join('')||'<li class="ok">Tidak ada masalah terdeteksi.</li>'}</ul></div>`}
// ---- pengaturan
V.set=()=>{const s=D().set;$('#main').innerHTML=`<div class="card"><b>Perhitungan</b><p>Kebijakan nilai remedial: <select onchange="D().set.policy=this.value;save();toast('Diterapkan ke semua analisis')"><option value="max" ${s.policy=='max'?'selected':''}>Nilai tertinggi (awal vs remedial)</option><option value="replace" ${s.policy=='replace'?'selected':''}>Remedial menggantikan nilai awal</option></select></p><p>Angka desimal: <select onchange="D().set.dec=+this.value;save()">${[0,1,2].map(n=>`<option ${s.dec==n?'selected':''}>${n}</option>`).join('')}</select></p></div>
<div class="card"><b>Akun</b><p>Pengguna: ${esc(me)}</p><button class="btn g" onclick="chPw()">Ubah password</button> <button class="btn g" onclick="logout()">Keluar</button></div>
<div class="card"><b>Data</b><p class="mut">Mode demo: data tersimpan di browser ini saja.</p><button class="btn p" onclick="if(confirm('Muat ulang data contoh? Semua perubahan Anda akan HILANG.')){D().students=[];Object.assign(DB.users[me].d,seed());save();sid=null;go('dash');toast('Data contoh dimuat (data simulasi).')}">Muat ulang data contoh</button></div>
<div class="card"><b>Riwayat perubahan</b><div style="max-height:200px;overflow:auto;font-size:13px">${D().log.map(esc).join('<br>')||'—'}</div></div>`}
async function chPw(){const o=prompt('Password lama:');if(o==null)return;if(await H(o)!=DB.users[me].h)return toast('Password lama salah.');const n=prompt('Password baru (min. 6 karakter):');if(!n||n.length<6)return toast('Password terlalu pendek.');DB.users[me].h=await H(n);save();toast('Password diubah.')}
try{me=sessionStorage.getItem('mm_me');if(me&&!DB.users[me])me=null}catch(e){me=null}
me?shell():authView(false);
</script></body></html>
